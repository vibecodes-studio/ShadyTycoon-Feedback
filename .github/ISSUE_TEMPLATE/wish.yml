name: Wish / idea
description: Something you would like the game to have or do differently.
labels: ["wish", "new"]
body:
  - type: textarea
    id: wish
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why? What problem does it solve?
  - type: textarea
    id: shots
    attributes:
      label: Screenshots / sketches (optional)
